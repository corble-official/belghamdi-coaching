<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belghamdi Coaching — استمارة التسجيل</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:#0b0b0f;color:#e7e7ea}
  .field{width:100%;background:#15151c;border:1px solid #2a2a35;border-radius:.75rem;padding:.7rem .9rem;color:#e7e7ea;font-size:1rem}
  .field:focus{outline:none;border-color:#f0712d}
  label{display:block;font-size:.85rem;color:#9a9aa6;margin:.9rem 0 .3rem}
  .primary{width:100%;background:#f0712d;color:#fff;font-weight:700;border-radius:.75rem;padding:.8rem;margin-top:1.2rem;font-size:1.05rem;cursor:pointer;border:none}
  .primary:disabled{opacity:.6;cursor:default}
  .card{max-width:560px;margin:2.5rem auto;background:#101016;border:1px solid #23232d;border-radius:1.25rem;padding:1.75rem}
  .badge{display:inline-block;background:#1b1b25;color:#f0712d;border:1px solid #3a2a1d;border-radius:.5rem;padding:.25rem .7rem;font-size:.8rem}
</style>
</head>
<body>
<div class="card">
  <div class="flex items-center justify-between mb-4">
    <span class="badge">Belghamdi Coaching</span>
    <span id="stage" class="text-xs text-gray-500"></span>
  </div>
  <h1 class="text-xl font-bold mb-1">استمارة التسجيل للعميل الجديد</h1>
  <p class="text-sm text-gray-400 mb-2">أهلاً <span id="cname">—</span> 👋 خمس دقائق فقط وتكون استمارة التسجيل جاهزة للبدء.</p>
  <form id="f" novalidate>
    <div id="wait" class="text-sm text-gray-500 py-6 text-center">جارٍ التحقق من الرابط…</div>
    <div id="formBody" style="display:none">
      <label for="full_name">الاسم الكامل *</label><input id="full_name" class="field" required>
      <label for="phone">رقم الهاتف / واتساب *</label><input id="phone" class="field" required inputmode="tel">
      <label for="email">البريد الإلكتروني</label><input id="email" class="field" type="email">
      <label for="fitness_goal">الهدف الأساسي *</label>
      <select id="fitness_goal" class="field" required>
        <option value="build_muscle">بناء العضلات والحجم</option>
        <option value="lose_weight">خسارة وزن</option>
        <option value="body_recomp">إعادة تشكيل الجسم</option>
        <option value="general_fitness">لياقة عامة</option>
      </select>
      <label for="training_days">عدد أيام التمرين أسبوعياً *</label>
      <select id="training_days" class="field" required>
        <option value="3">3 أيام</option><option value="4">4 أيام</option>
        <option value="5">5 أيام</option><option value="6">6 أيام</option>
      </select>
      <label for="training_location">مكان التمرين *</label>
      <select id="training_location" class="field" required>
        <option value="gym">جيم</option><option value="home">المنزل</option><option value="both">الجيم + المنزل</option>
      </select>
      <label for="experience_level">مستوى الخبرة *</label>
      <select id="experience_level" class="field" required>
        <option value="beginner">مبتدئ</option><option value="intermediate">متوسط</option><option value="advanced">متقدم</option>
      </select>
      <label for="notes">ملاحظات صحية / إصابات</label>
      <textarea id="notes" class="field" rows="3" placeholder="مثال: كتف سابق، ظهر، ركبة…"></textarea>
      <label for="photos">روابط صورك (اختياري — عدة روابط مفصولة بفاصلة)</label>
      <input id="photos" class="field" placeholder="https://…">
      <button id="btn" type="submit" class="primary">إرسال التسجيل ✓</button>
      <p id="msg" class="text-center text-sm mt-3"></p>
    </div>
  </form>
</div>
<script id="__data" type="application/json">__DATA_PLACEHOLDER__</script>
<script>
const params=new URLSearchParams(location.search);
const token=params.get('t');
const DATA=JSON.parse(atob(document.getElementById('__data').textContent));
function boot(){
  if(!DATA.success||DATA.already_completed){
    document.getElementById('wait').textContent = DATA.already_completed
      ? 'تم إرسال الاستمارة بالفعل — شكراً لك ✅'
      : (DATA.error==='token_expired'?'انتهت صلاحية الرابط — تواصل معنا لإرسال رابط جديد':'يبدو أن الرابط غير صحيح');
    if(DATA.client_name) document.getElementById('cname').textContent=DATA.client_name;
    return;
  }
  document.getElementById('cname').textContent=DATA.client_name||'';
  document.getElementById('wait').style.display='none';
  document.getElementById('formBody').style.display='';
  document.getElementById('stage').textContent='صالحة حتى '+new Date(DATA.expires_at).toLocaleDateString('ar-EG');
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const btn=document.getElementById('btn'); btn.disabled=true;
  const data=Object.fromEntries(new FormData(document.getElementById('f')).entries());
  const photos=(data.photos||'').split(',').map(s=>s.trim()).filter(Boolean);
  delete data.photos;
  const r=await fetch('/webhook/form/onboarding-submit?t='+encodeURIComponent(token),{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data,photos})});
  const j=await r.json();
  const msg=document.getElementById('msg');
  if(j.success){ document.getElementById('formBody').innerHTML=''; msg.className='text-center text-green-400 mt-3';
    msg.textContent='تم التسجيل بنجاح ✅ هيتم التواصل معك قريباً مع خطتك.'; }
  else { msg.className='text-center text-red-400 mt-3';
    msg.textContent=(j.error==='already_completed')?'تم التسجيل بالفعل':'حدث خطأ — حاول مرة أخرى'; btn.disabled=false; }
});
boot();
</script>
</body>
</html>
